name: Build APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build variant to produce"
        type: choice
        options: [ debug, release ]
        default: debug
      build_format:
        description: "Output format (APK or AAB)"
        type: choice
        options: [ apk, aab ]
        default: apk
      clean_build:
        description: "Run 'clean' before building?"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LSFG-Android-Application

    steps:
      - name: Checkout repo (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('LSFG-Android-Application/**/*.gradle*', 'LSFG-Android-Application/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Decode release keystore (optional)
        if: ${{ github.event.inputs.build_type == 'release' && env.LSFG_KEYSTORE_BASE64 != '' }}
        env:
          LSFG_KEYSTORE_BASE64: ${{ secrets.LSFG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$LSFG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          echo "keystore_path=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"

      - name: Clean Project (Optional)
        if: ${{ github.event.inputs.clean_build == 'true' }}
        run: ./gradlew clean

      - name: Build debug
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          if [ "${{ github.event.inputs.build_format }}" = "aab" ]; then
            ./gradlew :app:bundleDebug --stacktrace
          else
            ./gradlew :app:assembleDebug --stacktrace
          fi

      - name: Build release
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          ORG_GRADLE_PROJECT_LSFGAndroid_STORE_FILE: ${{ env.keystore_path }}
          ORG_GRADLE_PROJECT_LSFGAndroid_STORE_PASSWORD: ${{ secrets.LSFG_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_LSFGAndroid_KEY_ALIAS: ${{ secrets.LSFG_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_LSFGAndroid_KEY_PASSWORD: ${{ secrets.LSFG_KEY_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.build_format }}" = "aab" ]; then
            ./gradlew :app:bundleRelease --stacktrace
          else
            ./gradlew :app:assembleRelease --stacktrace
          fi

      - name: Upload App artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsfg-android-${{ github.event.inputs.build_type || 'debug' }}-${{ github.event.inputs.build_format || 'apk' }}-${{ github.sha }}
          path: |
            LSFG-Android-Application/app/build/outputs/apk/**/*.apk
            LSFG-Android-Application/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14
